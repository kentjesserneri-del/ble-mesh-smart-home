[env:esp32dev]
platform = espressif32 @ 5.0.0
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
upload_port = COM5

lib_extra_dirs =
    ../common/esp-idf-lib/components
    ../common

build_flags =
    -DCONFIG_I2CDEV_TIMEOUT=100000

board_build.partitions = partitions.csv