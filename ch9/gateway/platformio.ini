[env:esp32dev]
platform = espressif32 @ 5.0.0
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = time

lib_extra_dirs =
    ../../common/esp-idf-lib/components
    ../common

board_build.partitions = partitions.csv

build_flags =
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"